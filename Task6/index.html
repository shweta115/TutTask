<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./index.css"/>
    <link rel="shortcut icon" href="./img/laundry.png" type="image/x-icon"/>
</head>
<body>
    <div class="container">
        <div class="left">
            <img src="./img/laundry.jpg" alt="logo"/>
        </div>
        <div class="right">
            <form class="login-form" action="#">
                <h1>Hello Again!</h1>
                <p class="welcome-message">Welcome back! we missed you!</p>
                <div class="form-box">
                    <label for="email">Email</label>
                    <input type="email" placeholder="Emailid@domain.com" name="email" required/>
                </div>  
                <div class="form-box">
                    <label for="password">Password</label>
                    <input type="password" placeholder="Password" name="password" required/>
                </div>
                <div class="form-box">
                    <a href="#">Forgot Password</a>
                </div>
                <div class="form-box">
                    <button type="submit">Login</button>
                </div>
                <p class="register-text">
                        Not a member?
                        <a href="#">Register Now</a>
                </p>
                    
                    
                </form>
            </div>
            
            
        </div>
    </div>
</body>
</html>
